name: docker

# Builds the backend and web images and publishes them to Docker Hub, using the
# repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a token with
# Read & Write access). Pull requests only check that the images build.
#
# Tags pushed to tonyliuzj/proxy-hide, per component (backend, web):
#   <component>                 moving tag that compose.yaml uses; updated from main
#   <component>-<short sha>     one immutable tag per commit
#   <component>-<version>       for pushed tags such as v1.2.3

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  # Never cancel a publish half way through; only supersede older pull request runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: tonyliuzj/proxy-hide
  # Every backend dependency and the web build's native packages ship prebuilt binaries
  # for both. The arm64 web build runs under QEMU and is the slow step; remove
  # linux/arm64 here if you only deploy to x86-64 hosts.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  image:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: web
            context: ./web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ matrix.component }},enable={{is_default_branch}}
            type=sha,prefix=${{ matrix.component }}-,format=short
            type=semver,pattern={{version}},prefix=${{ matrix.component }}-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
