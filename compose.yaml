name: proxyhide

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proxyhide}
      POSTGRES_USER: ${POSTGRES_USER:-proxyhide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proxyhide-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: tonyliuzj/proxy-hide:backend
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://proxyhide:proxyhide-dev@postgres:5432/proxyhide}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GEOIP_DATABASE_PATH: ${GEOIP_DATABASE_PATH:-/data/geoip/GeoLite2-City.mmdb}
    volumes:
      - ./geoip:/data/geoip:ro
    ports:
      - "8000:8000"
      - "9000:9000"
      - "${GATEWAY_SOCKS_PORT:-1080}:1080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: tonyliuzj/proxy-hide:web
    build:
      context: ./web
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api/v1}
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
